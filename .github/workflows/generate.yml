name: Generate 3D Contribution Graph

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          npm install

      - name: Generate 3D contribution graph
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Push to assets branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # GIF はバイナリのため差分圧縮がほとんど効かず、追記し続けると
          # 1世代 約4MB がそのまま履歴に積み上がり clone が重くなる。
          # 毎回 orphan の単一コミットとして作り直し、force push で常に1世代だけ保持する。
          cp public/contribution-graph.gif "${RUNNER_TEMP}/contribution-graph.gif"

          git checkout --orphan assets-new
          git rm -rf --cached . >/dev/null
          mv "${RUNNER_TEMP}/contribution-graph.gif" contribution-graph.gif

          git add -f contribution-graph.gif
          git commit -m "Update 3D contribution graph"
          git push --force origin assets-new:assets
