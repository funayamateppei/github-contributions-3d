name: Generate 3D Contribution Graph

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libxi-dev libglu1-mesa-dev libglew-dev pkg-config
          npm install

      - name: Generate 3D contribution graph
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Push to assets branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Create or checkout orphan assets branch
          git fetch origin assets || true
          if git rev-parse --verify origin/assets >/dev/null 2>&1; then
            git checkout assets
          else
            git checkout --orphan assets
            git rm -rf .
          fi

          # Copy the generated GIF
          cp public/contribution-graph.gif contribution-graph.gif

          # Commit and push to assets branch
          git add contribution-graph.gif
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update 3D contribution graph"
            git push origin assets
          fi
